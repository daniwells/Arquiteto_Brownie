name: Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installing Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installing dependencies
        run: npm install

      - name: Criar arquivo .env
        run: |
          echo "DATABASE_URL=postgres://test_user:test_password@127.0.0.1:5432/test_db" > .env
          # echo "DATABASE_URL=postgres://neondb_owner:npg_BfWmaorQ9YO3@ep-sparkling-bread-a5399btb-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require" > .env

      - name: Verificar se PostgreSQL está pronto
        run: |
          until pg_isready -h postgres -U test_user; do
            echo "Aguardando PostgreSQL iniciar..."
            sleep 2
          done
          echo "PostgreSQL pronto!"

      - name: Rodar migrações no banco de testes
        run: npx prisma migrate dev --name init --schema=src/prisma/schema.prisma

      - name: Run prisma
        run: npx prisma generate
      
      - name: Run seed
        run: npx prisma db seed

      - name: Run tests
        run: npm test --verbose
